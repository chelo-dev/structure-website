<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="15%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow-left)"/>
  <rect width="1200" height="630" fill="url(#glow-right)"/>

  <!-- Top border gradient line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#text-grad)"/>

  <!-- Badge -->
  <rect x="80" y="160" width="250" height="36" rx="18" fill="url(#pill-grad)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="205" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#60a5fa" text-anchor="middle" letter-spacing="1">DESARROLLO WEB</text>

  <!-- Main title -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="white" letter-spacing="-2">Kharma</text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">
    <tspan fill="url(#text-grad)">Solutions</tspan>
  </text>

  <!-- Divider line -->
  <rect x="80" y="378" width="600" height="2" rx="1" fill="url(#text-grad)" opacity="0.4"/>

  <!-- Tagline -->
  <text x="80" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" letter-spacing="-0.3">Sitios web de alto rendimiento que impulsan tu negocio</text>

  <!-- Price badge -->
  <rect x="80" y="460" width="320" height="50" rx="25" fill="url(#text-grad)"/>
  <text x="240" y="491" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">Desde $2,499 MXN</text>

  <!-- Hosting badge -->
  <rect x="416" y="460" width="340" height="50" rx="25" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <text x="586" y="491" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">Hosting + Dominio GRATIS</text>

  <!-- URL / domain -->
  <text x="80" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#475569" letter-spacing="0.5">kharmasolutions.com</text>

  <!-- Decorative circles (right side) -->
  <circle cx="950" cy="315" r="220" fill="none" stroke="#3b82f6" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="950" cy="315" r="160" fill="none" stroke="#8b5cf6" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="8 6"/>
  <circle cx="950" cy="315" r="90" fill="#3b82f6" fill-opacity="0.05"/>
  <circle cx="950" cy="315" r="50" fill="url(#text-grad)" opacity="0.15"/>

  <!-- K letter in circle -->
  <text x="950" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="white" fill-opacity="0.9" text-anchor="middle">K</text>
</svg>
